<div>
  <ul>
    @for (playlist of playlists; track playlist.slug) {
    <li>
      <a
        [routerLink]="['/playlist', playlist.slug]"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        #rls="routerLinkActive"
        class="mb-4 block"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="50"
          height="50"
          viewBox="0 0 24 24"
          [attr.fill]="rls.isActive ? '#35a78a' : 'none'"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-folder-icon lucide-folder m-auto"
        >
          <path
            d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"
          />
        </svg>
        <div
          class="uppercase text-sm mt-1 text-ellipsis font-mono text-center"
          [class.font-bold]="rls.isActive"
          [class.font-light]="!rls.isActive"
        >
          {{ playlist.name }}
        </div>
      </a>
    </li>
    }
    <li>
      <a
        [routerLink]="['/playlist', 'golden_apple']"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        #rls="routerLinkActive"
        class="mb-4 block"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="50"
          height="50"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#F7655F"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-gift-icon lucide-gift m-auto"
        >
          <rect x="3" y="8" width="18" height="4" rx="1" />
          <path d="M12 8v13" />
          <path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7" />
          <path
            d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"
          />
        </svg>
        <div
          class="uppercase text-sm mt-1 text-ellipsis font-mono text-center text-[#F7655F]"
          [class.font-bold]="rls.isActive"
          [class.font-light]="!rls.isActive"
        >
          Gift
        </div>
      </a>
    </li>
  </ul>
</div>
