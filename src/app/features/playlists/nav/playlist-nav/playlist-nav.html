<div>
  <ul>
    @for (playlist of playlists; track playlist.slug) {
    <li>
      <a
        [routerLink]="['/playlist', playlist.slug]"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        #rls="routerLinkActive"
        class="mb-4 block"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="50"
          height="50"
          viewBox="0 0 24 24"
          [attr.fill]="rls.isActive ? '#35a78a' : 'none'"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-folder-icon lucide-folder"
        >
          <path
            d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"
          />
        </svg>
        <div class="font-light uppercase text-sm mt-1 text-ellipsis">
          {{ playlist.name}}
        </div>
      </a>
    </li>
    }
  </ul>
</div>
